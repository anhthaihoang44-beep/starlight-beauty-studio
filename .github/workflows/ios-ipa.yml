name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Info.plist
        run: plutil -lint ios/StarlightBeautyStudio/Info.plist

      - name: Build unsigned iOS app
        run: |
          xcodebuild clean build \
            -project ios/StarlightBeautyStudio.xcodeproj \
            -target StarlightBeautyStudio \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/ios_build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA for Sideloadly
        run: |
          mkdir -p "$RUNNER_TEMP/ipa_stage/Payload"
          cp -R "$RUNNER_TEMP/ios_build/StarlightBeautyStudio.app" "$RUNNER_TEMP/ipa_stage/Payload/"
          cd "$RUNNER_TEMP/ipa_stage"
          zip -r9 "$GITHUB_WORKSPACE/StarlightBeautyStudio.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarlightBeautyStudio-IPA
          path: StarlightBeautyStudio.ipa
          if-no-files-found: error

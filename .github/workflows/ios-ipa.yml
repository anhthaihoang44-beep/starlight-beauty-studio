name: Build Native Swift iOS IPA (Sideloadly)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Info.plist & Xcode version
        run: |
          xcodebuild -version
          plutil -lint ios/StarlightBeautyStudio/Info.plist

      - name: Build Pure Native iOS Release App (.app)
        run: |
          xcodebuild \
            -project ios/StarlightBeautyStudio.xcodeproj \
            -scheme StarlightBeautyStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Unsigned Native IPA for Sideloadly
        run: |
          rm -rf ipa_build StarlightBeautyStudio-Sideloadly.ipa
          mkdir -p ipa_build/Payload
          cp -R ios/DerivedData/Build/Products/Release-iphoneos/StarlightBeautyStudio.app ipa_build/Payload/StarlightBeautyStudio.app
          test -f ipa_build/Payload/StarlightBeautyStudio.app/Info.plist
          test -f ipa_build/Payload/StarlightBeautyStudio.app/StarlightBeautyStudio
          (cd ipa_build && zip -qr ../StarlightBeautyStudio-Sideloadly.ipa Payload)
          ls -lh StarlightBeautyStudio-Sideloadly.ipa

      - name: Upload Native IPA Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarlightBeautyStudio-IPA
          path: StarlightBeautyStudio-Sideloadly.ipa
          retention-days: 90

      - name: Publish Native IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" StarlightBeautyStudio-Sideloadly.ipa --clobber
          else
            gh release create "$TAG" StarlightBeautyStudio-Sideloadly.ipa \
              --title "Starlight Beauty Studio — Pure Native Swift iOS IPA (Sideloadly)" \
              --notes "100% Native SwiftUI + CoreGraphics Canvas iOS build (arm64, zero WebView). Sign and sideload via Sideloadly."
          fi
